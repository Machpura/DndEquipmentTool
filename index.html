<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>D&D 5e Equipment Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <style>
    .rarity-common { border-left: 4px solid #9ca3af; }
    .rarity-uncommon { border-left: 4px solid #10b981; }
    .rarity-rare { border-left: 4px solid #3b82f6; }
    .rarity-veryrare { border-left: 4px solid #8b5cf6; }
    .rarity-legendary { border-left: 4px solid #f59e0b; }
    .rarity-artifact { border-left: 4px solid #ef4444; }
    .slot-empty { border: 2px dashed #d1d5db; }
    .slot-filled { border: 2px solid #3b82f6; }
    .pulse-online { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <div id="app" class="container mx-auto p-4 max-w-7xl">
    <!-- Header -->
    <div class="bg-gray-800 rounded-lg p-4 mb-6">
      <div class="flex justify-between items-center mb-4">
        <h1 class="text-3xl font-bold text-blue-400">D&D 5e Equipment Tracker</h1>
        <div id="sessionStatus" class="flex items-center gap-2">
          <span class="text-sm text-gray-400">Offline</span>
        </div>
      </div>

      <!-- Session Controls -->
      <div id="sessionControls" class="flex gap-4 items-center flex-wrap">
        <button onclick="app.showHostModal()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded">🎲 Host Session (DM)</button>
        <button onclick="app.showJoinModal()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">👥 Join Session (Player)</button>
        <button onclick="app.showExportModal()" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded">💾 Export Backup</button>
        <button onclick="app.showImportModal()" class="bg-yellow-600 hover:bg-yellow-700 px-4 py-2 rounded">📥 Import Backup</button>
      </div>

      <!-- Active Session Info -->
      <div id="activeSessionInfo" class="hidden mt-4 p-4 bg-gray-700 rounded-lg">
        <div class="flex justify-between items-center">
          <div>
            <div class="text-sm text-gray-400">Session Code</div>
            <div class="text-2xl font-bold text-green-400" id="sessionCode">------</div>
          </div>
          <button onclick="app.disconnectSession()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded">Disconnect</button>
        </div>
      </div>
    </div>

    <!-- Character Selection -->
    <div class="bg-gray-800 rounded-lg p-4 mb-6">
      <div class="flex gap-4 items-center flex-wrap">
        <select id="characterSelect" onchange="app.switchCharacter(this.value)" class="bg-gray-700 text-white px-4 py-2 rounded flex-grow"></select>
        <button onclick="app.showCreateCharacterModal()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded" id="newCharBtn">New Character</button>
        <button onclick="app.cloneCharacter()" class="bg-yellow-600 hover:bg-yellow-700 px-4 py-2 rounded" id="cloneCharBtn">Clone</button>
        <button onclick="app.deleteCharacter()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded" id="deleteCharBtn">Delete</button>
        <button onclick="app.undo()" id="undoBtn" class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded hidden">Undo Delete</button>
      </div>
    </div>

    <!-- World Buffs -->
    <div class="bg-gray-800 rounded-lg p-6 mb-6">
      <h2 class="text-2xl font-bold mb-4 text-blue-300">World Buffs</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="worldBuffs"></div>
    </div>

    <!-- Main Content -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Equipment & Stats -->
      <div class="lg:col-span-2">
        <div class="bg-gray-800 rounded-lg p-6">
          <h2 class="text-2xl font-bold mb-4 text-blue-300">Equipment Slots</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="equipmentSlots"></div>
        </div>

        <div class="bg-gray-800 rounded-lg p-6 mt-6">
          <h2 class="text-2xl font-bold mb-4 text-blue-300">Total Stats</h2>
          <div id="totalStats" class="grid grid-cols-2 md:grid-cols-3 gap-3"></div>
        </div>
      </div>

      <!-- Right Column: Vaults -->
      <div class="flex flex-col min-h-[32rem]">
        <!-- Item Vault -->
        <div class="bg-gray-800 rounded-lg p-6 mb-6">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold text-blue-300">Item Vault (Shared)</h2>
            <button onclick="app.showCreateItemModal()" class="bg-green-600 hover:bg-green-700 px-3 py-1 rounded text-sm" id="addItemBtn">+ Add Item</button>
          </div>
          <input type="text" id="vaultSearchItems" oninput="app.filterItemVault(this.value)" placeholder="Search items..." class="w-full bg-gray-700 text-white px-3 py-2 rounded mb-4">
          <div id="vaultItems" class="space-y-2 max-h-72 overflow-y-auto"></div>
        </div>

        <!-- Buff Vault -->
        <div class="bg-gray-800 rounded-lg p-6 flex-1 min-h-0">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold text-blue-300">Buff Vault</h2>
            <button onclick="app.showCreateBuffModal()" class="bg-green-600 hover:bg-green-700 px-3 py-1 rounded text-sm" id="addBuffBtn">+ Add Buff</button>
          </div>
          <input type="text" id="vaultSearchBuffs" oninput="app.filterBuffVault(this.value)" placeholder="Search buffs..." class="w-full bg-gray-700 text-white px-3 py-2 rounded mb-4">
          <div id="vaultBuffs" class="space-y-2 h-full overflow-y-auto"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modals -->
  <div id="modalContainer"></div>

  <script>
    const SLOTS = ['Head','Amulet','Cloak','Armor','Belt','Gloves','Ring 1','Ring 2','Main Hand','Off Hand','Shield','BootS','Misc 1','Misc 2'];
    const WORLD_BUFF_SLOTS = ['World Buff 1','World Buff 2','World Buff 3'];
    const RARITIES = ['Common','Uncommon','Rare','Very Rare','Legendary','Artifact'];
    const SLOT_TYPES = [
  'Any',
  'Head',
  'Amulet',
  'Cloak',
  'Armor',
  'Belt',
  'Gloves',
  'Ring',
  'Main Hand',
  'Off Hand',
  'Shield',
  'Boots',
  'Misc'
];


    // Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBuVrJKcWVpxqSSVAzeVSnFAggRmlcPHao",
      authDomain: "dndequipmenttool.firebaseapp.com",
      projectId: "dndequipmenttool",
      storageBucket: "dndequipmenttool.firebasestorage.app",
      messagingSenderId: "237918823599",
      appId: "1:237918823599:web:d4da5bd6148532a544605a"
    };
    let firebaseInitialized = false;
    try {
      firebase.initializeApp(firebaseConfig);
      firebaseInitialized = true;
    } catch {
      console.warn('Firebase not configured or already initialized. Using offline mode only.');
    }

    // ---------- Normalizers ----------
    function normalizeStat(stat) {
      const name = (stat?.name || '').trim();
      const descSource = stat?.description ?? stat?.value ?? '';
      const description = String(descSource);

      // pull a numeric chunk if present (supports "5", "+5", "AC +2", etc.)
      const rawForNumber = stat?.value ?? stat?.description ?? '';
      const numMatch = String(rawForNumber).match(/[-+]?\d*\.?\d+/);
      const value = numMatch ? parseFloat(numMatch[0]) : null;

      return {
        name,
        description,
        value,
        locked: !!stat?.locked
      };
    }

function normalizeItem(item) {
  if (!item || typeof item !== 'object') {
    return {
      id: Date.now().toString(),
      name: 'Unnamed Item',
      rarity: 'Common',
      slotType: 'Any',
      description: '',
      stats: []
    };
  }
  return {
    id: item.id || Date.now().toString(),
    name: item.name || 'Unnamed Item',
    rarity: item.rarity || 'Common',
    slotType: item.slotType || 'Any',
    description: item.description || '',
    stats: Array.isArray(item.stats) ? item.stats.map(normalizeStat) : []
  };
}


function normalizeCharacter(char) {
  if (!char || typeof char !== 'object') {
    return {
      id: Date.now().toString(),
      name: 'Unnamed Character',
      equipment: {},
      worldBuffs: {}
    };
  }

  const equipment =
    (char.equipment && typeof char.equipment === 'object')
      ? { ...char.equipment }
      : {};

  const rawWorldBuffs =
    (char.worldBuffs && typeof char.worldBuffs === 'object')
      ? char.worldBuffs
      : {};

  const worldBuffs = {};
  Object.entries(rawWorldBuffs).forEach(([slot, value]) => {
    if (!value) return;
    if (typeof value === 'string') {
      // old format: just the buff id
      worldBuffs[slot] = { id: value, source: '' };
    } else if (typeof value === 'object') {
      // new / mixed format
      const id = value.id || value.buffId || value.itemId || '';
      if (!id) return;
      worldBuffs[slot] = {
        id,
        source: value.source || value.note || ''
      };
    }
  });

  return {
    id: char.id || Date.now().toString(),
    name: char.name || 'Unnamed Character',
    equipment,
    worldBuffs
  };
}


    function normalizeAllCharacters(chars) {
      const out = {};
      if (!chars || typeof chars !== 'object') return out;
      Object.entries(chars).forEach(([id, c]) => {
        out[id] = normalizeCharacter({ id, ...c });
      });
      return out;
    }

    function getAllowedSlotsForItem(item) {
  const type = item?.slotType || 'Any';
  switch (type) {
    case 'Head':      return ['Head'];
    case 'Amulet':    return ['Amulet'];
    case 'Cloak':     return ['Cloak'];
    case 'Armor':     return ['Armor'];
    case 'Belt':      return ['Belt'];
    case 'Gloves':    return ['Gloves'];
    case 'Ring':      return ['Ring 1', 'Ring 2'];
    case 'Main Hand': return ['Main Hand'];
    case 'Off Hand':  return ['Off Hand'];
    case 'Shield':    return ['Shield'];
    case 'Boots':     return ['BootS']; // matches your SLOTS entry
    case 'Misc':      return ['Misc 1', 'Misc 2'];
    default:          return SLOTS.slice(); // Any slot
  }
}


    // ---------- Permissions ----------
    function canEditCurrent(app) {
      if (app.state.session.isDM) return true;
      if (!app.state.session.active) return true;
      return app.state.session.assignedCharacter &&
             app.state.currentCharacter === app.state.session.assignedCharacter;
    }

    function canEditWorldBuffs(app) {
      return canEditCurrent(app);
    }

    function canManageItems(app) {
      return app.state.session.isDM || !app.state.session.active;
    }

    function canManageBuffs(app) {
      return app.state.session.isDM || !app.state.session.active;
    }

    // ---------- Firebase sync helpers ----------
    function syncCharacterToFirebase(app, charId) {
      if (!app.state.session.active || !app.state.session.ref || !charId) return;
      const char = app.state.characters[charId];
      if (!char) return;
      app.state.session.ref.child('characters/' + charId).set(char).catch(console.error);
    }

    function syncItemVaultToFirebase(app) {
      if (!app.state.session.active || !app.state.session.ref) return;
      if (!app.state.session.isDM) return;
      app.state.session.ref.child('itemVault').set(app.state.itemVault).catch(console.error);
    }

    function syncBuffVaultToFirebase(app) {
      if (!app.state.session.active || !app.state.session.ref) return;
      if (!app.state.session.isDM) return;
      app.state.session.ref.child('buffVault').set(app.state.buffVault).catch(console.error);
    }

    // ---------- Claim/Create modal ----------
    function showClaimCharacterModal(appInstance) {
      const chars = Object.values(appInstance.state.characters || {});
      const options = chars.map(c =>
        `<option value="${c.id}">${c.name || 'Unnamed Character'}</option>`
      ).join('');
      const modal = `
        <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" onclick="this.remove()">
          <div class="bg-gray-800 rounded-lg p-6 max-w-md w-full m-4" onclick="event.stopPropagation()">
            <h3 class="text-xl font-bold mb-4">Claim or Create Character</h3>
            ${chars.length ? `
              <label class="text-sm text-gray-300 mb-1 block">Pick an existing one:</label>
              <select id="claimSelect" class="w-full bg-gray-700 text-white px-3 py-2 rounded mb-4">${options}</select>
              <button class="w-full bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded mb-3"
                onclick="(function(){ const id=document.getElementById('claimSelect').value; app.claimCharacter(id); document.querySelector('.fixed.inset-0').remove(); })()">
                ✅ Claim Selected
              </button>
            ` : `<div class="text-sm text-gray-400 mb-4">No characters yet. Wait for your DM to create one, or create one below if allowed.</div>`}
            <div class="border-t border-gray-700 my-3"></div>
            <label class="text-sm text-gray-300 mb-1 block">...or create new:</label>
            <input id="newCharName" class="w-full bg-gray-700 text-white px-3 py-2 rounded mb-3" placeholder="New character name">
            <button class="w-full bg-green-600 hover:bg-green-700 px-4 py-2 rounded"
              onclick="(function(){ const name=document.getElementById('newCharName').value||'New Character'; app.createCharacter(name); app.claimCharacter(Object.keys(app.state.characters).pop()); document.querySelector('.fixed.inset-0').remove(); })()">
              ➕ Create & Use
            </button>
          </div>
        </div>`;
      document.getElementById('modalContainer').innerHTML = modal;
    }

    // ---------- App ----------
    const app = {
      state: {
        characters: {},
        itemVault: [],
        buffVault: [],
        currentCharacter: null,
        isDMMode: false,
        undoStack: [],
        session: {
          active: false,
          code: null,
          isDM: false,
          assignedCharacter: null,
          ref: null
        }
      },

      init() {
        this.loadState();
        if (Object.keys(this.state.characters).length === 0) {
          const id = Date.now().toString();
          this.state.characters[id] = normalizeCharacter({ id, name: 'New Character' });
          this.state.currentCharacter = id;
        }
        this.render();
      },


            // --- Shared helpers for stat rows ---
      addStatRow(containerId) {
        const c = document.getElementById(containerId);
        if (!c) return;
        c.insertAdjacentHTML('beforeend', `
          <div class="flex gap-2 items-start stat-row mt-2">
            <input type="text" placeholder="Stat name"
              class="bg-gray-700 text-white px-3 py-2 rounded flex-grow stat-name">
            <textarea placeholder="Description / Value (multiline OK)"
              class="bg-gray-700 text-white px-3 py-2 rounded w-full stat-desc"></textarea>
            <button type="button"
              class="bg-gray-600 hover:bg-gray-700 px-3 py-2 rounded"
              onclick="app.toggleLock(this)">🔓</button>
            <input type="hidden" class="stat-locked" value="false">
            <button type="button"
              onclick="this.closest('.stat-row').remove()"
              class="bg-red-600 hover:bg-red-700 px-3 py-2 rounded">✕</button>
          </div>
        `);
      },

      toggleLock(btn) {
        const hidden = btn.parentElement.querySelector('.stat-locked');
        if (!hidden) return;
        hidden.value = hidden.value === 'true' ? 'false' : 'true';
        btn.textContent = hidden.value === 'true' ? '🔒' : '🔓';
      },


      loadState() {
        const saved = localStorage.getItem('dndEquipmentTracker');
        if (!saved) return;
        try {
          const loaded = JSON.parse(saved);
          this.state.characters = normalizeAllCharacters(loaded.characters || {});
          this.state.itemVault = Array.isArray(loaded.itemVault)
            ? loaded.itemVault.map(normalizeItem)
            : Array.isArray(loaded.vault)
              ? loaded.vault.map(normalizeItem)
              : [];
          this.state.buffVault = Array.isArray(loaded.buffVault)
            ? loaded.buffVault.map(normalizeItem)
            : [];
          this.state.currentCharacter = loaded.currentCharacter || Object.keys(this.state.characters)[0] || null;
          this.state.isDMMode = !!loaded.isDMMode;
          this.state.undoStack = loaded.undoStack || [];
        } catch (e) {
          console.error('Error loading state; starting fresh.', e);
          this.state.characters = {};
          this.state.itemVault = [];
          this.state.buffVault = [];
          this.state.currentCharacter = null;
          this.state.undoStack = [];
        }
      },

      saveState() {
        const toSave = {
          characters: this.state.characters,
          itemVault: this.state.itemVault,
          buffVault: this.state.buffVault,
          currentCharacter: this.state.currentCharacter,
          isDMMode: this.state.isDMMode,
          undoStack: this.state.undoStack
        };
        localStorage.setItem('dndEquipmentTracker', JSON.stringify(toSave));
      },

      generateSessionCode() {
        return Math.random().toString(36).substring(2, 8).toUpperCase();
      },

      attachSessionListeners() {
        if (!this.state.session.ref) return;
        const sessionRef = this.state.session.ref;

        // Characters
        const charsRef = sessionRef.child('characters');
        charsRef.off();

        charsRef.once('value', snap => {
          this.state.characters = normalizeAllCharacters(snap.val() || {});
          if (!this.state.currentCharacter || !this.state.characters[this.state.currentCharacter]) {
            this.state.currentCharacter = Object.keys(this.state.characters)[0] || null;
          }
          this.render();

          // Player: prompt claim AFTER characters are loaded
          if (this.state.session.active && !this.state.session.isDM && !this.state.session.assignedCharacter) {
            if (Object.keys(this.state.characters).length > 0) {
              showClaimCharacterModal(this);
            }
          }
        });

        charsRef.on('child_added', snap => {
          const id = snap.key;
          const val = snap.val();
          if (!val) return;
          this.state.characters[id] = normalizeCharacter({ id, ...val });
          if (!this.state.currentCharacter) this.state.currentCharacter = id;
          this.render();
        });

        charsRef.on('child_changed', snap => {
          const id = snap.key;
          const val = snap.val();
          if (!val) return;
          this.state.characters[id] = normalizeCharacter({ id, ...val });
          this.render();
        });

        charsRef.on('child_removed', snap => {
          const id = snap.key;
          delete this.state.characters[id];
          if (this.state.currentCharacter === id) {
            this.state.currentCharacter = Object.keys(this.state.characters)[0] || null;
          }
          this.render();
        });

        // Item Vault
        const itemRef = sessionRef.child('itemVault');
        itemRef.off();
        itemRef.on('value', snap => {
          const v = snap.val();
          this.state.itemVault = Array.isArray(v) ? v.map(normalizeItem) : [];
          this.render();
        });

        // Buff Vault
        const buffRef = sessionRef.child('buffVault');
        buffRef.off();
        buffRef.on('value', snap => {
          const v = snap.val();
          this.state.buffVault = Array.isArray(v) ? v.map(normalizeItem) : [];
          this.render();
        });
      },

      showHostModal() {
        if (!firebaseInitialized) {
          alert('Firebase not configured.');
          return;
        }
        const modal = `
          <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" onclick="this.remove()">
            <div class="bg-gray-800 rounded-lg p-6 max-w-md w-full m-4" onclick="event.stopPropagation()">
              <h3 class="text-xl font-bold mb-4">Host Session (DM)</h3>
              <p class="text-sm text-gray-400 mb-4">Characters, Item Vault & Buff Vault sync in real-time.</p>
              <div class="flex gap-2">
                <button onclick="app.hostSession(); this.closest('.fixed').remove()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded flex-grow">Start Hosting</button>
                <button onclick="this.closest('.fixed').remove()" class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded">Cancel</button>
              </div>
            </div>
          </div>`;
        document.getElementById('modalContainer').innerHTML = modal;
      },

      hostSession() {
        const code = this.generateSessionCode();
        this.state.session = {
          active: true,
          code,
          isDM: true,
          assignedCharacter: null,
          ref: firebase.database().ref('sessions/' + code)
        };
        this.state.isDMMode = true;

        this.state.session.ref.set({
          characters: this.state.characters,
          itemVault: this.state.itemVault,
          buffVault: this.state.buffVault,
          timestamp: Date.now()
        }).then(() => {
          this.attachSessionListeners();
          this.render();

          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(code).catch(err => {
              console.warn('Clipboard copy failed:', err);
            });
          }

          alert(`Session started! Share code: ${code} (code copied to clipboard if possible)`);
        }).catch(err => {
          console.error('Failed to start session', err);
          alert('Failed to start session. Please try again.');
        });
      },



      showJoinModal() {
        if (!firebaseInitialized) {
          alert('Firebase not configured.');
          return;
        }
        const modal = `
          <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" onclick="this.remove()">
            <div class="bg-gray-800 rounded-lg p-6 max-w-md w-full m-4" onclick="event.stopPropagation()">
              <h3 class="text-xl font-bold mb-4">Join Session (Player)</h3>
              <p class="text-sm text-gray-400 mb-4">Enter the session code from your DM.</p>
              <input id="joinCode" placeholder="Enter 6-digit code" class="w-full bg-gray-700 text-white px-3 py-2 rounded mb-4 uppercase text-center text-2xl">
              <div class="flex gap-2">
                <button onclick="app.joinSession(document.getElementById('joinCode').value); this.closest('.fixed').remove()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded flex-grow">Join Session</button>
                <button onclick="this.closest('.fixed').remove()" class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded">Cancel</button>
              </div>
            </div>
          </div>`;
        document.getElementById('modalContainer').innerHTML = modal;
      },

      joinSession(code) {
        if (!code || code.length !== 6) {
          alert('Invalid session code');
          return;
        }
        code = code.toUpperCase();
        this.state.session = {
          active: true,
          code,
          isDM: false,
          assignedCharacter: null,
          ref: firebase.database().ref('sessions/' + code)
        };
        this.state.isDMMode = false;

        this.attachSessionListeners();
        this.setupPlayerSync();
        this.render();
        alert(`Joined session: ${code}`);
      },

      setupPlayerSync() {
        const originalSave = this.saveState.bind(this);
        this.saveState = () => {
          originalSave();
          if (this.state.session.active &&
              !this.state.session.isDM &&
              this.state.session.ref &&
              this.state.session.assignedCharacter) {
            syncCharacterToFirebase(this, this.state.session.assignedCharacter);
          }
        };
      },

      disconnectSession() {
        if (this.state.session.ref) {
          this.state.session.ref.child('characters').off();
          this.state.session.ref.child('itemVault').off();
          this.state.session.ref.child('buffVault').off();
          if (this.state.session.isDM) {
            if (confirm('Delete session data from server?')) {
              this.state.session.ref.remove();
            }
          }
        }
        this.state.session = {
          active: false,
          code: null,
          isDM: false,
          assignedCharacter: null,
          ref: null
        };

        let data = null;

          try {
            data = JSON.parse(atob(raw.trim()));
          } catch {
            alert('Invalid backup format');
            return;
          }
        }
        if (!data || data.type !== 'full-backup') {
          alert('Invalid backup data');
          return;
        }
        if (!confirm('This will replace ALL current local data. Continue?')) return;

        this.state.characters = normalizeAllCharacters(data.characters || {});
        this.state.itemVault = Array.isArray(data.itemVault) ? data.itemVault.map(normalizeItem) : [];
        this.state.buffVault = Array.isArray(data.buffVault) ? data.buffVault.map(normalizeItem) : [];
        this.state.currentCharacter = Object.keys(this.state.characters)[0] || null;

          this.state.session.ref.child('itemVault').set(this.state.itemVault);

          if (!item || !Array.isArray(item.stats)) return;

          item.stats.forEach(stat => {
            if (stat.locked && !this.state.session.isDM) {
              hasHidden = true;
              return;
            }
            const key = (stat.name || '').trim();
            if (!key) return;
            const source = (stat.value != null) ? stat.value : stat.description;
            const match = String(source).match(/[-+]?\d*\.?\d+/);
            if (!match) return;
            const val = parseFloat(match[0]);
            if (isNaN(val)) return;
            totals[key] = (totals[key] || 0) + val;
          });
        };

Object.values(char.equipment || {}).forEach(applyItem);

Object.values(char.worldBuffs || {}).forEach(entry => {
  const id = typeof entry === 'string' ? entry : entry?.id;
  if (id) applyItem(id);
});


        return { stats: totals, hasHidden };
      },

      // ---------- Render ----------
      render() {
        this.renderCharacterSelect();
        this.renderWorldBuffs();
        this.renderEquipmentSlots();
        this.renderItemVault();
        this.renderBuffVault();
        this.renderTotalStats();
        this.renderSessionStatus();
        this.renderUndoButton();
        this.renderPermissions();
      },

      renderCharacterSelect() {
        const select = document.getElementById('characterSelect');
        if (!select) return;

        const isPlayer = this.state.session.active && !this.state.session.isDM;
        const assigned = this.state.session.assignedCharacter;

        const options = Object.values(this.state.characters).map(c => {
          let label = c.name;
          if (isPlayer && assigned === c.id) {
            label += ' (You)';
          }
          return `<option value="${c.id}" ${c.id === this.state.currentCharacter ? 'selected' : ''}>
                    ${label}
                  </option>`;
        }).join('');

        select.innerHTML = options;
      },


      renderWorldBuffs() {
        const char = this.state.characters[this.state.currentCharacter] || {};
        const container = document.getElementById('worldBuffs');
        const buffs = char.worldBuffs || {};
        const canEdit = canEditWorldBuffs(this);

        container.innerHTML = WORLD_BUFF_SLOTS.map(slot => {
 const entry = buffs[slot];
const buffId = typeof entry === 'string' ? entry : entry?.id;
const source = (entry && typeof entry === 'object' && entry.source) ? entry.source : '';

const item =
  buffId &&
  (this.state.buffVault.find(i => i.id === buffId) ||
   this.state.itemVault.find(i => i.id === buffId));

          if (item) {
            const visibleStats = (item.stats || []).filter(s =>
              this.state.session.isDM || !s.locked
            );
            return `
              <div class="bg-gray-700 rounded-lg p-4 slot-filled rarity-${(item.rarity || 'Common').toLowerCase().replace(' ','')}">
                <div class="flex justify-between items-start mb-2">
                  <div>
                    <div class="font-bold">${slot}</div>
                    <div class="text-sm text-blue-300 item-name">${item.name}</div>
                    <div class="text-xs text-gray-400">${item.rarity}</div>
                  </div>
                  ${canEdit ? `<button onclick="app.unequipItem('${slot}')" class="bg-red-600 hover:bg-red-700 px-2 py-1 rounded text-sm">Unequip</button>` : ''}
                </div>
                 ${visibleStats.length ? `
                  <div class="text-sm mt-2 space-y-1">
                    ${visibleStats.map(s =>
                      `<div><span class="font-semibold">${s.name}:</span> <span class="text-green-400 whitespace-pre-wrap">${s.description}</span></div>`
                    ).join('')}
                  </div>` : ''
                }

                <div class="mt-3">
                  <div class="text-xs text-gray-400 mb-1">Source</div>
                  ${
                    canEdit
                      ? `<input type="text"
                           class="w-full bg-gray-800 text-white text-xs px-2 py-1 rounded"
                           placeholder="Where did this buff come from?"
                           value="${(source || '').replace(/"/g, '&quot;')}"
                           onblur="app.updateWorldBuffSource('${slot}', this.value)">
                         `
                      : `<div class="text-xs text-gray-300 italic">${source ? source.replace(/</g, '&lt;') : '—'}</div>`
                  }
                </div>
              </div>`;

          } else {
            return `
              <div class="bg-gray-700 rounded-lg p-4 slot-empty">
                <div class="font-bold text-gray-400">${slot}</div>
                <div class="text-sm text-gray-500 mb-2">Empty</div>
                ${canEdit ? `
                  <select onchange="if(this.value){ app.equipItem(this.value, '${slot}'); this.value=''; }" class="w-full bg-gray-600 text-white px-2 py-1 rounded text-sm">
                    <option value="">Equip from Buff Vault...</option>
                    ${this.state.buffVault.map(v => `<option value="${v.id}">${v.name}</option>`).join('')}
                  </select>` : ''
                }
              </div>`;
          }
        }).join('');
      },

 renderEquipmentSlots() {
  const char = this.state.characters[this.state.currentCharacter] || {};
  const container = document.getElementById('equipmentSlots');
  const equip = char.equipment || {};
  const canEdit = canEditCurrent(this);

  container.innerHTML = SLOTS.map(slot => {
    const itemId = equip[slot];
    const item =
      itemId &&
      (this.state.itemVault.find(i => i.id === itemId) ||
       this.state.buffVault.find(i => i.id === itemId));
    if (item) {
      const visibleStats = (item.stats || []).filter(s =>
        this.state.session.isDM || !s.locked
      );
      return `
        <div class="bg-gray-700 rounded-lg p-4 slot-filled rarity-${(item.rarity || 'Common').toLowerCase().replace(' ','')}">
          <div class="flex justify-between items-start mb-2">
            <div>
              <div class="font-bold">${slot}</div>
              <div class="text-sm text-blue-300 item-name">${item.name}</div>
              <div class="text-xs text-gray-400">${item.rarity}</div>

              ${item.slotType && item.slotType !== 'Any'
                ? `<div class="text-[10px] text-blue-300 uppercase tracking-wide mt-1">
                     Type: ${item.slotType}
                   </div>`
                : ''}

              ${item.description
                ? `<div class="text-xs text-gray-300 whitespace-pre-wrap mt-1">
                     ${item.description}
                   </div>`
                : ''}
            </div>
            ${canEdit
              ? `<button onclick="app.unequipItem('${slot}')"
                  class="bg-red-600 hover:bg-red-700 px-2 py-1 rounded text-sm">Unequip</button>`
              : ''}
          </div>
          ${visibleStats.length ? `
            <div class="text-sm mt-2 space-y-1">
              ${visibleStats.map(s =>
                `<div><span class="font-semibold">${s.name}:</span>
                 <span class="text-green-400 whitespace-pre-wrap">${s.description}</span></div>`
              ).join('')}
            </div>` : ''
          }
        </div>`;
    } else {
      return `
        <div class="bg-gray-700 rounded-lg p-4 slot-empty">
          <div class="font-bold text-gray-400">${slot}</div>
          <div class="text-sm text-gray-500 mb-2">Empty</div>
          ${canEdit ? `
            <select onchange="if(this.value){ app.equipItem(this.value, '${slot}'); this.value=''; }"
              class="w-full bg-gray-600 text-white px-2 py-1 rounded text-sm">
              <option value="">Equip from Item Vault...</option>
              ${this.state.itemVault.map(v => `<option value="${v.id}">${v.name}</option>`).join('')}
            </select>` : ''
          }
        </div>`;
    }
  }).join('');
},


      renderItemVault() {
        const container = document.getElementById('vaultItems');
        if (!this.state.itemVault.length) {
          container.innerHTML = '<div class="text-gray-500 text-center py-4">No items in vault</div>';
          return;
        }
        const isDM = canManageItems(this);

        // Hide items that are currently equipped by any character
        const equippedIds = new Set();
        Object.values(this.state.characters).forEach(c => {
          Object.values(c.equipment || {}).forEach(id => equippedIds.add(id));
        });

        const visibleItems = this.state.itemVault.filter(i => !equippedIds.has(i.id));

        if (!visibleItems.length) {
          container.innerHTML = '<div class="text-gray-500 text-center py-4">All items are currently equipped</div>';
          return;
        }

        const canEquipHere =
          this.state.session.isDM ||
          !this.state.session.active ||
          canEditCurrent(this);

container.innerHTML = visibleItems.map(item => {
  const visibleStats = (item.stats || []).filter(s =>
    this.state.session.isDM || !s.locked
  );
  return `
    <div class="bg-gray-700 rounded-lg p-3 rarity-${(item.rarity || 'Common').toLowerCase().replace(' ','')}">
      <div class="flex justify-between items-start mb-2">
        <div class="flex-grow">
          <div class="font-bold item-name">${item.name}</div>
          <div class="text-xs text-gray-400">${item.rarity}</div>
          ${item.slotType && item.slotType !== 'Any'
            ? `<div class="text-[10px] text-blue-300 uppercase tracking-wide">Type: ${item.slotType}</div>`
            : ''
          }
          ${item.description
            ? `<div class="text-xs text-gray-300 whitespace-pre-wrap mb-1">${item.description}</div>`
            : ''
          }
        </div>
        ${isDM ? `
          <div class="flex gap-1">
            <button onclick="app.editItem('${item.id}')"
              class="bg-blue-600 hover:bg-blue-700 px-2 py-1 rounded text-xs">Edit</button>
            <button onclick="app.duplicateItem('${item.id}')"
              class="bg-yellow-600 hover:bg-yellow-700 px-2 py-1 rounded text-xs">Copy</button>
            <button onclick="app.deleteItem('${item.id}')"
              class="bg-red-600 hover:bg-red-700 px-2 py-1 rounded text-xs">Del</button>
          </div>` : ''
        }
      </div>
      ${visibleStats.length ? `
        <div class="text-xs space-y-1 mb-2">
          ${visibleStats.map(s =>
            `<div><span class="font-semibold">${s.name}:</span> <span class="text-green-400 whitespace-pre-wrap">${s.description}</span></div>`
          ).join('')}
        </div>` : ''
      }
      ${canEquipHere ? `
        <select onchange="if(this.value){ app.equipItem('${item.id}', this.value); this.value=''; }"
          class="w-full bg-gray-600 text-white px-2 py-1 rounded text-sm">
          <option value="">Equip to...</option>
          ${getAllowedSlotsForItem(item).map(s => `<option value="${s}">${s}</option>`).join('')}
        </select>` : ''
      }
    </div>`;
}).join('');

      },

      renderBuffVault() {
        const container = document.getElementById('vaultBuffs');
        if (!this.state.buffVault.length) {
          container.innerHTML = '<div class="text-gray-500 text-center py-4">No buffs in vault</div>';
          return;
        }
        const isDM = canManageBuffs(this);
        const canEquipHere =
          this.state.session.isDM ||
          !this.state.session.active ||
          canEditWorldBuffs(this);

        container.innerHTML = this.state.buffVault.map(item => {
          const visibleStats = (item.stats || []).filter(s =>
            this.state.session.isDM || !s.locked
          );
          return `
            <div class="bg-gray-700 rounded-lg p-3 rarity-${(item.rarity || 'Common').toLowerCase().replace(' ','')}">
              <div class="flex justify-between items-start mb-2">
                <div class="flex-grow">
                  <div class="font-bold item-name">${item.name}</div>
                  <div class="text-xs text-gray-400">${item.rarity}</div>
                </div>
                ${isDM ? `
                  <div class="flex gap-1">
                    <button onclick="app.editBuff('${item.id}')"
                      class="bg-blue-600 hover:bg-blue-700 px-2 py-1 rounded text-xs">Edit</button>
                    <button onclick="app.duplicateBuff('${item.id}')"
                      class="bg-yellow-600 hover:bg-yellow-700 px-2 py-1 rounded text-xs">Copy</button>
                    <button onclick="app.deleteBuff('${item.id}')"
                      class="bg-red-600 hover:bg-red-700 px-2 py-1 rounded text-xs">Del</button>
                  </div>` : ''
                }

              </div>
              ${visibleStats.length ? `
                <div class="text-xs space-y-1 mb-2">
                  ${visibleStats.map(s =>
                    `<div><span class="font-semibold">${s.name}:</span> <span class="text-green-400 whitespace-pre-wrap">${s.description}</span></div>`
                  ).join('')}
                </div>` : ''
              }
              ${canEquipHere ? `
                <select onchange="if(this.value){ app.equipItem('${item.id}', this.value); this.value=''; }" class="w-full bg-gray-600 text-white px-2 py-1 rounded text-sm">
                  <option value="">Equip to...</option>
                  ${WORLD_BUFF_SLOTS.map(s => `<option value="${s}">${s}</option>`).join('')}
                </select>` : ''
              }
            </div>`;
        }).join('');
      },

      renderTotalStats() {
        const { stats, hasHidden } = this.calculateTotalStats();
        const container = document.getElementById('totalStats');
        const entries = Object.entries(stats);
        if (!entries.length) {
          container.innerHTML = '<div class="col-span-full text-gray-500 text-center py-4">No equipment stats</div>';
          return;
        }
        container.innerHTML =
          entries.map(([name, value]) => `
            <div class="bg-gray-700 rounded p-3">
              <div class="text-sm text-gray-400">${name}</div>
              <div class="text-xl font-bold text-green-400">${value > 0 ? '+' : ''}${value}</div>
            </div>
          `).join('') +
          (this.state.session.isDM && hasHidden
            ? `<div class="col-span-full bg-yellow-900 bg-opacity-30 rounded p-3 text-yellow-400 text-sm text-center">
                 🔒 Some totals include hidden stats (DM view)
               </div>`
            : '');
      },

      renderSessionStatus() {
        const statusEl = document.getElementById('sessionStatus');
        const infoEl = document.getElementById('activeSessionInfo');
        const codeEl = document.getElementById('sessionCode');
        if (this.state.session.active) {
          statusEl.innerHTML =
            `<span class="w-2 h-2 bg-green-500 rounded-full pulse-online"></span>` +
            `<span class="text-sm font-bold text-green-400">${this.state.session.isDM ? 'Hosting' : 'Connected'}</span>`;
          infoEl.classList.remove('hidden');
          codeEl.textContent = this.state.session.code;
        } else {
          statusEl.innerHTML = '<span class="text-sm text-gray-400">Offline</span>';
          infoEl.classList.add('hidden');
        }
      },

      renderUndoButton() {
        const btn = document.getElementById('undoBtn');
        if (!btn) return;
        if (this.state.undoStack.length > 0) {
          btn.classList.remove('hidden');
        } else {
          btn.classList.add('hidden');
        }
      },

      renderPermissions() {
        const isDM = this.state.session.isDM || !this.state.session.active;

        const controls = [
          ['addItemBtn', canManageItems(this)],
          ['addBuffBtn', canManageBuffs(this)],
          ['newCharBtn', isDM],
          ['cloneCharBtn', isDM],
          ['deleteCharBtn', isDM]
        ];

        controls.forEach(([id, allowed]) => {
          const el = document.getElementById(id);
          if (!el) return;
          if (!allowed) {
            el.disabled = true;
            el.classList.add('opacity-50', 'cursor-not-allowed');
          } else {
            el.disabled = false;
            el.classList.remove('opacity-50', 'cursor-not-allowed');
          }
        });
      }
    };

    window.app = app;
    window.onload = () => app.init();
  </script>
</body>
</html>
